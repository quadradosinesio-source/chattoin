<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chat Firebase</title>

  <style>
    body {
      font-family: Arial;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
    }

    .chat {
      width: 400px;
      background: #fff;
      margin-top: 50px;
      border-radius: 10px;
      overflow: hidden;
    }

    .messages {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
    }

    .messages p {
      margin: 5px 0;
    }

    .input {
      display: flex;
      border-top: 1px solid #ccc;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
    }

    button {
      padding: 10px;
      background: green;
      color: white;
      border: none;
    }
  </style>
</head>
<body>

<div class="chat">
  <div class="messages" id="messages"></div>

  <div class="input">
    <input id="msg" placeholder="Digite..." />
    <button onclick="send()">Enviar</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // 🔥 SUA CONFIG (já está certa)
  const firebaseConfig = {
    apiKey: "AIzaSyAVyK9QComos6PVHl_5pmM5QNOEruKP0f0",
    authDomain: "chattoin-449e3.firebaseapp.com",
    projectId: "chattoin-449e3",
    storageBucket: "chattoin-449e3.firebasestorage.app",
    messagingSenderId: "1062945243458",
    appId: "1:1062945243458:web:3d81511daf7f45edb748db"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const messagesDiv = document.getElementById("messages");

  function render(text) {
    const p = document.createElement("p");
    p.textContent = text;
    messagesDiv.appendChild(p);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // 🔴 TEMPO REAL AQUI
  const q = query(collection(db, "chat"), orderBy("time"));

  onSnapshot(q, (snapshot) => {
    messagesDiv.innerHTML = "";
    snapshot.forEach(doc => {
      render(doc.data().text);
    });
  });

  // 🟢 ENVIAR MENSAGEM
  window.send = async function() {
    const input = document.getElementById("msg");

    if (!input.value.trim()) return;

    await addDoc(collection(db, "chat"), {
      text: input.value,
      time: Date.now()
    });

    input.value = "";
  };
</script>

</body>
</html>
